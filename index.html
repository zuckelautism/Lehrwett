<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Anwesenheitswette</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Press+Start+2P&family=Pacifico&family=Bangers&family=Cinzel:wght@700&family=Orbitron:wght@700&family=Cinzel+Decorative:wght@700&display=swap">
<style>
:root{--bg:#eef2f6;--ink:#14213d;--mute:#5b6577;--card:#fff;--line:#d3dbe6;--mark:#ffd60a;--ja:#1f8a5f;--nein:#c93c54;font-family:"Bricolage Grotesque",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#10151f;--ink:#e8edf5;--mute:#9aa6ba;--card:#1a2130;--line:#2c3649}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.45}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
[hidden]{display:none!important}
h1{font-size:2rem;font-weight:800;margin:.2em 0 .4em;letter-spacing:-.02em}
h1 span{background:linear-gradient(transparent 55%,var(--mark) 55%)}
h2{font-size:1.15rem;margin:1.4em 0 .5em}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
input,button{font:inherit;border-radius:8px;border:1px solid var(--line);padding:9px 12px;background:var(--card);color:var(--ink)}
input{width:100%;margin:4px 0}
button{cursor:pointer;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--mark);outline-offset:1px}
.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ja{background:var(--ja);color:#fff;border-color:var(--ja)}
.nein{background:var(--nein);color:#fff;border-color:var(--nein)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1;min-width:90px;width:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pts{font-size:1.6rem;font-weight:800}
.mute{color:var(--mute);font-size:.9rem}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.new{border-left:5px solid var(--mark)}
select{font:inherit;border-radius:8px;border:1px solid var(--line);padding:9px 12px;background:var(--card);color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.nm{display:inline-block}
.f_pixel{font-family:"Press Start 2P",monospace;font-size:.7em}
.f_hand{font-family:"Pacifico",cursive}
.f_comic{font-family:"Bangers",cursive;letter-spacing:.05em}
.f_serif{font-family:"Cinzel",serif;font-weight:700}
.f_neon{font-family:"Orbitron",sans-serif;letter-spacing:.05em}
.f_mystic{font-family:"Cinzel Decorative",serif;font-weight:700}
.c_violet{color:#9b5de5}.c_lavender{color:#a78bfa}.c_midnight{color:#5c6bff}.c_moon{color:#8d99ae}
.c_nebula{background-image:linear-gradient(90deg,#9b5de5,#f15bb5,#00bbf9,#9b5de5)}
.c_galaxy{background-image:linear-gradient(90deg,#4361ee,#7b2cbf,#c77dff,#e0aaff,#4361ee)}
.c_gold{color:#d4a017}.c_pink{color:#ff2fa0}.c_ice{color:#4cc9f0}
.c_rainbow,.c_fire,.c_nebula,.c_galaxy{background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.c_rainbow{background-image:linear-gradient(90deg,#f33,#fa0,#ee0,#3c3,#0cf,#63f,#f3c,#f33)}
.c_fire{background-image:linear-gradient(90deg,#ffd60a,#ff6b00,#e01e37,#ff6b00,#ffd60a)}
@media(prefers-reduced-motion:no-preference){
.c_rainbow,.c_fire,.c_nebula,.c_galaxy{animation:bgm 3s linear infinite}
.a_pulse{animation:pls 1.4s ease-in-out infinite}
.a_float{animation:flt 2.2s ease-in-out infinite}
.a_wobble{animation:wob .9s ease-in-out infinite}
.a_glow{animation:glw 1.6s ease-in-out infinite}
.a_twinkle{animation:twk 2.4s ease-in-out infinite}
.a_aura{animation:aur 2.2s ease-in-out infinite}
}
@keyframes bgm{to{background-position:200% 0}}
@keyframes pls{50%{transform:scale(1.12)}}
@keyframes flt{50%{transform:translateY(-3px)}}
@keyframes wob{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes glw{50%{filter:drop-shadow(0 0 7px var(--mark))}}
@keyframes twk{0%,100%{opacity:1}40%{opacity:.55}55%{opacity:1;filter:brightness(1.4)}70%{opacity:.7}}
@keyframes aur{50%{filter:drop-shadow(0 0 8px #9b5de5) drop-shadow(0 0 16px #5a189a)}}
#prof{z-index:15}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:30;max-width:90vw;text-align:center}
.lb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;margin:6px 0;border:2px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.lb .l{display:flex;align-items:center;gap:8px;min-width:0}
.lb .r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ttl{font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--line);white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.t_first{border-color:#4cc9f0}.t_rek{border-color:#2a9d6f}.t_vet{border-color:#7b8bb0}.t_under{border-color:#9b5de5}.t_sniper{border-color:#e01e37}.t_roller,.t_tycoon{border-color:#d4a017}.t_hot{border-color:#ff6b00}.t_squad{border-color:#2a9d6f}
.t_inferno,.t_stil{border:2px solid transparent;background-size:auto,200% 100%;background-clip:padding-box,border-box}
.t_inferno{background-image:linear-gradient(var(--card),var(--card)),linear-gradient(90deg,#ffd60a,#ff6b00,#e01e37,#ff6b00,#ffd60a)}
.t_stil{background-image:linear-gradient(var(--card),var(--card)),linear-gradient(90deg,#f33,#fa0,#3c3,#0cf,#63f,#f33)}
@media(prefers-reduced-motion:no-preference){.t_hot{animation:gl1 1.6s ease-in-out infinite}.t_roller,.t_tycoon,.t_squad{animation:gl2 2s ease-in-out infinite}.t_inferno,.t_stil{animation:bgm 3s linear infinite}}
@keyframes gl1{50%{box-shadow:0 0 12px #ff6b00}}
@keyframes gl2{50%{box-shadow:0 0 12px var(--mark)}}
.bc{cursor:pointer}.bc:hover{border-color:var(--ink)}
#modal,#news,#prof{position:fixed;inset:0;background:rgba(10,15,25,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.mw{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:640px){#modal,#news,#prof{align-items:center}.mw{border-radius:16px}}
#news{z-index:20}
textarea{font:inherit;width:100%;min-height:80px;resize:vertical;margin:4px 0;border-radius:8px;border:1px solid var(--line);padding:9px 12px;background:var(--card);color:var(--ink)}
input[type=checkbox]{width:auto;margin:0}
.wdl{display:flex;gap:4px;align-items:center;font-weight:700}
.stt{font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--line)}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.tg button{padding:12px;opacity:.55}.tg button.sel{opacity:1;outline:3px solid var(--mark)}
.big{font-size:2.2rem;font-weight:800;line-height:1}
.pos{color:var(--ja)}
.neg{color:var(--nein)}
.tabs button[aria-selected=true]{background:var(--mark);color:#14213d;border-color:var(--mark)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin:8px 0}
.bar i{background:var(--ja)}
.bar b{background:var(--nein)}
.err{color:var(--nein);font-weight:700;min-height:1.4em}
.rk{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
code{background:var(--line);padding:2px 6px;border-radius:5px}
</style>
</head>
<body>

<main id="auth" hidden>
  <h1><span>Anwesenheitswette</span></h1>
  <div class="card">
    <input id="u" placeholder="Benutzername (a-z, 0-9, _)" autocomplete="username">
    <input id="p" type="password" placeholder="Passwort (mind. 6 Zeichen)" autocomplete="current-password">
    <input id="c" placeholder="Einladungscode oder Name eines Spielers" autocapitalize="none">
    <p class="err" id="aerr"></p>
    <div class="row">
      <button class="pri" data-act="login">Anmelden</button>
      <button data-act="register">Mit Code registrieren</button>
    </div>
  </div>
  <p class="mute">Nur Spielpunkte, kein echtes Geld.</p>
</main>

<main id="app" hidden>
  <div class="top">
    <div><div class="mute" id="who" data-act="prof" style="cursor:pointer" title="Mein Profil"></div><div class="pts" id="pts"></div><div class="mute" id="streak"></div></div>
    <button data-act="logout">Abmelden</button>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="nbar"></div>
  <section id="view"></section>
</main>

<div id="modal" hidden></div>
<div id="news" hidden></div>
<div id="prof" hidden></div>
<div id="toast" hidden></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,setDoc,addDoc,collection,onSnapshot,writeBatch,serverTimestamp,updateDoc,increment,arrayUnion,deleteDoc,getDoc,getDocs,query,where,limit} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3nmLvWFZ-VQkr_lJ3pWzPNroa-jTH_PA",
  authDomain: "lehrwetten.firebaseapp.com",
  projectId: "lehrwetten",
  storageBucket: "lehrwetten.firebasestorage.app",
  messagingSenderId: "657511674851",
  appId: "1:657511674851:web:9b1f83887fa6cafe0f26d6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mail = n => n + "@wette.local";
const fmt = d => d.split("-").reverse().join(".");

let openBet = null, mSide = "ja", mAmt = "", serien = [], tickets = [], newsDone = false, profU = null, TM = new Map(), dv = 0;
let seenAt = null, hl = 0, ST = {}, rd = {};
let me = null, users = [], wetten = [], tipps = [], codes = [], tab = "wetten", subs = [], codesSub = null;

const snap = (col, set) => onSnapshot(collection(db, col), s => { set(s.docs.map(d => ({id: d.id, ...d.data()}))); dv++; rd[col] = 1; render(); });

onAuthStateChanged(auth, u => {
  subs.forEach(f => f()); subs = []; if (codesSub) { codesSub(); codesSub = null; }
  me = null; rd = {}; seenAt = null; openBet = null; newsDone = false;
  if (!u) { $("#auth").hidden = false; $("#app").hidden = true; $("#modal").hidden = true; $("#news").hidden = true; return; }
  subs.push(onSnapshot(doc(db, "users", u.uid), s => {
    me = s.exists() ? {id: s.id, ...s.data()} : null;
    $("#auth").hidden = !!me; $("#app").hidden = !me;
    if (me && seenAt === null) { seenAt = +ls.get("s_" + me.id) || 0; if (!seenAt) { seenAt = Date.now(); ls.set("s_" + me.id, seenAt); } }
    if (me && me.rolle === "admin" && !codesSub) { const u1 = snap("codes", v => codes = v), u2 = snap("serien", v => serien = v); codesSub = () => { u1(); u2(); }; }
    render();
  }));
  subs.push(snap("users", v => users = v), snap("wetten", v => wetten = v), snap("tipps", v => { tipps = v; TM = new Map(v.map(t => [t.id, t])); }), snap("tickets", v => tickets = v));
});

async function register() {
  const n = $("#u").value.trim().toLowerCase(), p = $("#p").value, cRaw = $("#c").value.trim(), cu = cRaw.toUpperCase(), cl = cRaw.toLowerCase();
  if (!/^[a-z0-9_]{3,20}$/.test(n)) return err("Benutzername: 3-20 Zeichen, nur a-z, 0-9 und _.");
  if (p.length < 6) return err("Passwort: mindestens 6 Zeichen.");
  if (!cRaw) return err("Bitte Einladungscode oder den Namen eines Spielers eingeben.");
  let cred;
  try { cred = await createUserWithEmailAndPassword(auth, mail(n), p); }
  catch (e) { return err(e.code === "auth/email-already-in-use" ? "Benutzername ist schon vergeben." : "Registrierung fehlgeschlagen."); }
  try {
    const b = writeBatch(db), uid = cred.user.uid;
    const cs = await getDoc(doc(db, "codes", cu));
    if (cs.exists()) { // Einladungscode vom Admin
      b.set(doc(db, "users", uid), {name: n, points: 1000, rolle: "user", code: cu, joined: serverTimestamp()});
      b.update(doc(db, "codes", cu), {uses: increment(1)});
    } else { // Referral: Name eines Spielers, der dafür 300 Punkte bekommt
      const q = await getDocs(query(collection(db, "users"), where("name", "==", cl), limit(1)));
      if (q.empty) throw new Error("unbekannt");
      b.set(doc(db, "users", uid), {name: n, points: 1000, rolle: "user", refBy: q.docs[0].id, joined: serverTimestamp()});
      b.update(doc(db, "users", q.docs[0].id), {points: increment(300), referrals: increment(1)});
    }
    await b.commit();
  } catch (e) {
    await cred.user.delete();
    err("Code oder Spielername ungültig, aufgebraucht oder das Einladungslimit ist erreicht.");
  }
}
async function login() {
  try { await signInWithEmailAndPassword(auth, mail($("#u").value.trim().toLowerCase()), $("#p").value); }
  catch (e) { err("Benutzername oder Passwort falsch."); }
}
const err = m => $("#aerr").textContent = m;

const open = () => me ? tipps.filter(t => t.uid === me.id && !t.ausgewertet).reduce((s, t) => s + t.einsatz, 0) : 0;
const pool = (w, side) => tipps.filter(t => t.wetteId === w.id && t.seite === side).reduce((s, t) => s + t.einsatz, 0);

async function bet(wid, side, el) {
  const w = wetten.find(x => x.id === wid), e = parseInt(el.value, 10);
  if (!e || e < 1 || e > me.points - open()) return alert("Einsatz muss zwischen 1 und deinen freien Punkten liegen.");
  try { await setDoc(doc(db, "tipps", wid + "_" + me.id), {wetteId: wid, uid: me.id, name: me.name, seite: side, einsatz: e, ausgewertet: false, zeit: serverTimestamp()}); }
  catch (x) { alert("Tipp nicht möglich (Wette evtl. schon geschlossen)."); }
}

async function settle(wid, ergebnis, minuten) {
  const w0 = wetten.find(x => x.id === wid), w = {...w0, ergebnis};
  if (!confirm("Ergebnis '" + LB(w0)[ergebnis] + (minuten !== undefined ? " (" + minuten + " Min)" : "") + "' festlegen und Punkte verteilen?")) return;
  const b = writeBatch(db);
  tipps.filter(t => t.wetteId === wid).forEach(t => {
    const d = delta(w, t), u = users.find(x => x.id === t.uid);
    if (d) b.update(doc(db, "users", t.uid), {points: Math.max(0, u.points + d)}); // d=0: Einsatz zurück
    b.update(doc(db, "tipps", t.id), {ausgewertet: true});
  });
  b.update(doc(db, "wetten", wid), {status: "beendet", ergebnis, bonus: true, pot: potOf(w), beendetAm: serverTimestamp(), ...(minuten !== undefined ? {minuten} : {})});
  await b.commit();
}

// ----- Wettarten, Personen-Typen, Serien -----
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const num = (el, d) => { const x = parseFloat(el.value); return isNaN(x) ? d : x; };
const LB = w => w.art === "ueu" ? {ja: "Drüber", nein: "Drunter"} : {ja: "Anwesend", nein: "Nicht da"};
const skey = w => (w.typ || "lehrer") + "|" + w.lehrer.trim().toLowerCase();
const frageFor = b => b.art === "ueu"
  ? "Kommt " + b.lehrer + " am " + fmt(b.datum) + " mehr als " + b.linie + " Min zu spät?"
  : "Ist " + b.lehrer + " am " + fmt(b.datum) + (b.typ === "freund" ? " da?" : " anwesend?");
const mkBet = b => ({lehrer: b.lehrer, typ: b.typ, art: b.art, ...(b.art === "ueu" ? {linie: b.linie} : {}), datum: b.datum,
  frage: frageFor(b), status: "offen", ergebnis: null, pot: b.pot, erstellt: serverTimestamp()});
const resultTxt = w => w.art === "ueu"
  ? w.lehrer + " war am " + fmt(w.datum) + (w.minuten !== undefined ? " " + w.minuten + " Min" : "") + " zu spät (Linie " + w.linie + "): " + LB(w)[w.ergebnis].toLowerCase() + "."
  : w.lehrer + " war am " + fmt(w.datum) + (w.ergebnis === "ja" ? (w.typ === "freund" ? " da." : " anwesend.") : " nicht da.");
const settleBtns = w => w.art === "ueu"
  ? `<button class="pri" data-act="settleU" data-w="${w.id}">Verspätung eintragen</button>`
  : `<button class="ja" data-act="settle" data-w="${w.id}" data-s="ja">War ${w.typ === "freund" ? "da" : "anwesend"}</button><button class="nein" data-act="settle" data-w="${w.id}" data-s="nein">War nicht da</button>`;
const betFields = p => `<input id="${p}l" placeholder="Name oder Kürzel"><select id="${p}t" aria-label="Typ"><option value="lehrer">Lehrer</option><option value="freund">Schüler</option></select><select id="${p}a" aria-label="Wettart"><option value="anw">Anwesenheit</option><option value="ueu">Verspätung drüber/drunter</option></select><input id="${p}m" type="number" step="0.5" min="0" value="5" title="Linie in Minuten (nur Drüber/Drunter)" aria-label="Linie in Minuten" style="max-width:90px"><select id="${p}p" aria-label="Pot-Multiplikator"><option value="2">Pot ×2</option><option value="1">Pot ×1</option><option value="3">Pot ×3</option></select>`;

async function newBet() {
  const l = $("#wl").value.trim(), d = $("#wd").value;
  if (!l || !d) return alert("Name und Datum angeben.");
  await addDoc(collection(db, "wetten"), mkBet({lehrer: l, typ: $("#wt").value, art: $("#wa").value, linie: num($("#wm"), 5), datum: d, pot: +$("#wp").value || 2}));
}
async function newSerie() {
  const l = $("#sl").value.trim(), tage = [...document.querySelectorAll(".wd:checked")].map(x => +x.value);
  if (!l || !tage.length) return alert("Name und mindestens einen Wochentag wählen.");
  await addDoc(collection(db, "serien"), {lehrer: l, typ: $("#st").value, art: $("#sa").value, linie: num($("#sm"), 5), tage, vorlauf: Math.max(0, parseInt($("#sv").value, 10) || 0), pot: +$("#sp").value || 2, aktiv: true});
}
const serienHtml = () => `<h2>Wiederkehrende Wetten</h2><div class="card"><div class="row">${betFields("s")}</div>
  <div class="row" style="margin-top:8px">${[1, 2, 3, 4, 5, 6, 0].map(d => `<label class="wdl"><input type="checkbox" class="wd" value="${d}">${WD[d]}</label>`).join("")}</div>
  <div class="row" style="margin-top:8px"><input id="sv" type="number" min="0" max="14" value="3" aria-label="Tage im Voraus" style="max-width:90px"><span class="mute">Tage vorher anlegen</span><button class="pri" data-act="newserie">Serie anlegen</button></div></div>
  <p class="mute">Die Wetten werden angelegt, sobald ein Admin die Seite öffnet.</p>` +
  (serien.map(s => `<div class="card top"><div><b>${esc(s.lehrer)}</b><div class="mute">${s.typ === "freund" ? "Schüler" : "Lehrer"} · ${s.art === "ueu" ? "Drüber/Drunter, Linie " + s.linie + " Min" : "Anwesenheit"} · ${s.tage.map(d => WD[d]).join(", ")} · ${s.vorlauf ?? 3} Tage vorher · Pot ×${s.pot}${s.aktiv === false ? " · pausiert" : ""}</div></div><div class="row"><button data-act="sertog" data-i="${s.id}">${s.aktiv === false ? "Aktivieren" : "Pausieren"}</button><button data-act="serdel" data-i="${s.id}" aria-label="Serie löschen">✕</button></div></div>`).join("") || `<p class="mute">Noch keine Serien.</p>`);

// Legt fällige Serien-Wetten an (nur wenn ein Admin die Seite offen hat); feste ID verhindert Doppelte
const made = new Set();
function autoGen() {
  if (!me || me.rolle !== "admin" || !ready() || !rd.serien) return;
  const n = new Date();
  serien.filter(x => x.aktiv !== false).forEach(x => {
    for (let k = 0; k <= (x.vorlauf ?? 3); k++) {
      const dt = new Date(n.getFullYear(), n.getMonth(), n.getDate() + k), datum = ymd(dt), id = x.id + "_" + datum;
      if (!x.tage.includes(dt.getDay()) || made.has(id) || wetten.some(w => w.id === id)) continue;
      made.add(id);
      setDoc(doc(db, "wetten", id), mkBet({...x, datum})).catch(() => made.delete(id));
    }
  });
}
async function settleU(wid) {
  const w = wetten.find(x => x.id === wid), r = prompt("Tatsächliche Verspätung in Minuten (0 = pünktlich). Linie: " + w.linie);
  if (r === null) return;
  const m = parseFloat(r.replace(",", "."));
  if (isNaN(m) || m < 0) return alert("Bitte eine Zahl eingeben.");
  settle(wid, m > w.linie ? "ja" : "nein", m);
}

// ----- Tickets -----

const sum = a => a.reduce((s, t) => s + t.einsatz, 0);

const bt = w => ts(w.beendetAm) || ts(w.erstellt);
const pools = w => { const a = tipps.filter(x => x.wetteId === w.id); return {wp: sum(a.filter(x => x.seite === w.ergebnis)), lp: sum(a.filter(x => x.seite !== w.ergebnis))}; };
// Serien-Bonus: richtige Tipps in Folge VOR dieser Wette (Rückerstattungen zählen nicht)
const potOf = w => w.pot ?? (w.status === "beendet" ? 1 : 2); // alte, schon beendete Wetten ohne Pot
const mult = n => n >= 4 ? 2 : n === 3 ? 1.5 : n === 2 ? 1.25 : 1;
const fx = k => String(k).replace(".", ",");
function streakBefore(uid, w) {
  const tw = w.status === "beendet" ? bt(w) : Infinity;
  const L = wetten.filter(b => b.status === "beendet" && b.id !== w.id && bt(b) < tw).sort((a, b) => bt(b) - bt(a));
  let n = 0;
  for (const b of L) {
    const t = TM.get(b.id + "_" + uid); if (!t) continue;
    const {wp, lp} = pools(b); if (!wp || !lp) continue;
    if (t.seite === b.ergebnis) n++; else break;
  }
  return n;
}
// Punkte-Änderung eines Tipps in einer beendeten (oder gerade auszuwertenden) Wette
function delta(w, t) {
  const {wp, lp} = pools(w); if (!wp || !lp) return 0;
  if (t.seite !== w.ergebnis) return -t.einsatz;
  const k = (w.status === "beendet" && !w.bonus) ? 1 : mult(streakBefore(t.uid, w)); // alte Wetten ohne Bonus
  return Math.floor((Math.floor(t.einsatz * (wp + lp) * potOf(w) / wp) - t.einsatz) * k);
}
const resTxt = d => d > 0 ? "Du gewinnst +" + d + " Punkte." : d < 0 ? "Du verlierst " + (-d) + " Punkte." : "Dein Einsatz kommt zurück.";

}

}

let memo = {v: -1, p: new Map()};
function PS(uid) {
  if (memo.v !== dv) memo = {v: dv, p: new Map()};
  if (!memo.p.has(uid)) memo.p.set(uid, calc(uid));
  return memo.p.get(uid);
}
function calc(uid) {
  const mine = tipps.filter(x => x.uid === uid), L = [];
  wetten.forEach(w => { if (w.status !== "beendet") return; const t = TM.get(w.id + "_" + uid); if (t) L.push({w, t}); });
  L.sort((a, b) => bt(a.w) - bt(b.w));
  const r = {placed: mine.length, maxStake: mine.reduce((m, t) => Math.max(m, t.einsatz), 0), win: 0, loss: 0, lost: 0, cur: 0, best: 0, under: 0, wins: []};
  L.forEach(({w, t}) => {
    const {wp, lp} = pools(w); if (!wp || !lp) return; // Rückerstattung zählt nicht
    if (t.seite === w.ergebnis) { r.win++; r.cur++; r.best = Math.max(r.best, r.cur); r.wins.push({w, t}); if (wp / (wp + lp) <= 0.25) r.under++; }
    else { r.loss++; r.lost += t.einsatz; r.cur = 0; }
  });
  return r;
}

const tz = t => ts(t.zeit) || (t.zeit === null ? Date.now() : 0);
function chart(w) {
  const L = tipps.filter(t => t.wetteId === w.id).sort((a, b) => tz(a) - tz(b));
  if (!L.length) return `<p class="mute">Noch keine Tipps, die Chance steht bei 50 %.</p>`;
  let j = 0, tot = 0; const P = [50];
  L.forEach(t => { tot += t.einsatz; if (t.seite === "ja") j += t.einsatz; P.push(j / tot * 100); });
  const pts = P.map((p, i) => (i * 300 / (P.length - 1)).toFixed(1) + "," + (100 - p).toFixed(1)).join(" ");
  return `<div class="mute">Chance auf "${LB(w).ja.toLowerCase()}" im Verlauf der Tipps</div><svg viewBox="0 0 300 100" preserveAspectRatio="none" style="width:100%;height:110px" role="img" aria-label="Verlauf der Chance"><line x1="0" x2="300" y1="50" y2="50" stroke="var(--line)" stroke-dasharray="4" vector-effect="non-scaling-stroke"/><polyline fill="none" stroke="var(--ja)" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${pts}"/></svg>`;
}

function est(w) {
  const e = parseInt(mAmt, 10); if (!e || e < 1) return "Einsatz eingeben, dann siehst du den möglichen Gewinn.";
  const a = pool(w, mSide) + e, o = pool(w, mSide === "ja" ? "nein" : "ja");
  if (!o) return "Auf der Gegenseite hat noch niemand getippt. Bleibt es dabei, bekommst du deinen Einsatz zurück.";
  const k = mult(streakBefore(me.id, {id: "_", status: "offen"})), g = Math.floor((Math.floor(e * (a + o) * potOf(w) / a) - e) * k);
  return "Möglicher Gewinn beim aktuellen Pool: +" + g + " Punkte" + (potOf(w) > 1 ? " mit Pot ×" + potOf(w) : "") + (k > 1 ? " (inkl. Serien-Bonus ×" + fx(k) + ")" : "") + ". Bei Verlust: −" + e + ".";
}

function renderModal() {
  const M = $("#modal"), w = openBet && wetten.find(x => x.id === openBet);
  if (!w || !me) { M.hidden = true; M.innerHTML = ""; return; }
  if (!M.hidden && M.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;
  const was = M.hidden, c = chance(w), m = myTip(w), isOpen = w.status === "offen", s = ST[skey(w)];
  let tr;
  if (!isOpen) tr = `<div class="card"><b>Ergebnis: ${esc(resultTxt(w))}</b>${m ? "<br>" + resTxt(delta(w, m)) : ""}</div>`;
  else if (m) tr = `<div class="card">Dein Tipp: <b>${LB(w)[m.seite].toUpperCase()}</b> mit ${m.einsatz} Punkten.</div>`;
  else tr = `<div class="card"><div class="tg"><button class="ja ${mSide === "ja" ? "sel" : ""}" data-act="side" data-s="ja">${LB(w).ja} ${c.p} %</button><button class="nein ${mSide === "nein" ? "sel" : ""}" data-act="side" data-s="nein">${LB(w).nein} ${100 - c.p} %</button></div>
    <input id="amt" type="number" min="1" inputmode="numeric" placeholder="Einsatz in Punkten" value="${esc(mAmt)}">
    <div class="row"><button data-act="amt" data-v="10">+10</button><button data-act="amt" data-v="50">+50</button><button data-act="amt" data-v="100">+100</button><button data-act="amt" data-v="max">Max</button></div>
    <p class="mute" id="est">${est(w)}</p><button class="pri" data-act="bet2" style="width:100%">Tipp abgeben</button></div>`;
  if (isOpen && me.rolle === "admin") tr += `<div class="card"><div class="mute">Admin: Wette auswerten</div><div class="row" style="margin-top:6px">${settleBtns(w)}</div></div>`;
  const H = tipps.filter(t => t.wetteId === w.id).sort((a, b) => b.einsatz - a.einsatz);
  M.hidden = false;
  M.innerHTML = `<div class="mw" role="dialog" aria-modal="true" aria-label="Wette"><div class="top"><span class="mute">${isOpen ? "Offene Wette" : "Beendet"}${s ? " · bisherige Anwesenheit " + Math.round(s.da / s.all * 100) + " %" : ""}</span><button data-act="close" aria-label="Schließen">✕</button></div>
    <h2 style="margin-top:.5em">${esc(w.frage)}</h2>
    <div class="top"><div><div class="big pos">${c.p} %</div><div class="mute">${LB(w).ja}</div></div><div style="text-align:right"><div class="big neg">${100 - c.p} %</div><div class="mute">${LB(w).nein}</div></div></div>
    <div class="bar"><i style="width:${c.p}%"></i><b style="width:${100 - c.p}%"></b></div>
    <div class="mute">Pool: ${c.t} Punkte${potOf(w) > 1 ? " · Pot ×" + potOf(w) + ": " + c.t * potOf(w) + " Punkte gehen an die Gewinner" : ""}</div>${chart(w)}${tr}
    <h2>Tipps (${H.length})</h2><div class="card">${H.map(t => `<div class="rk"><span>${nm(t.name, (users.find(x => x.id === t.uid) || {}).equipped)}</span><span class="${t.seite === "ja" ? "pos" : "neg"}">${LB(w)[t.seite]} · ${t.einsatz}</span></div>`).join("") || `<span class="mute">Noch keine Tipps.</span>`}</div></div>`;
  if (was) M.querySelector("[data-act=close]").focus();
}
const closeM = () => { openBet = null; renderModal(); };

function render() {
  if (!me) return;
  $("#who").textContent = me.name + (me.rolle === "admin" ? " (Admin)" : ""); $("#who").dataset.u = me.id;
  $("#pts").textContent = me.points + " Punkte" + (open() ? " (" + (me.points - open()) + " frei)" : "");
  ST = stats(); check(); renderModal(); renderProf(); autoGen();
  if (!newsDone && ls.get("v_" + me.id) !== VERSION) showNews();
  const sk = streakBefore(me.id, {id: "_", status: "offen"});
  $("#streak").textContent = "Serie: " + sk + " richtig in Folge" + (mult(sk) > 1 ? " (nächster Gewinn ×" + fx(mult(sk)) + ")" : " (Bonus ab 2 in Folge)");
  if (tab === "updates" && seenAt !== null) { seenAt = Date.now(); ls.set("s_" + me.id, seenAt); }
  const nt = me.rolle === "admin" ? tickets.filter(t => t.status === "offen").length : 0;
  const todo = wetten.filter(w => w.status === "offen" && !myTip(w)).length, unread = feed().filter(e => e.t > seenAt).length;
  const T = [["wetten", "Wetten" + (todo ? " (" + todo + ")" : "")], ["updates", "Updates" + (unread ? " (" + unread + ")" : "")], ["anw", "Anwesenheit"], ["rang", "Rangliste"], ["shop", "Shop"], ["tickets", "Tickets" + (nt ? " (" + nt + ")" : "")]];
  if (me.rolle === "admin") T.push(["admin", "Admin"]);
  $("#tabs").innerHTML = T.map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" data-act="tab" data-t="${k}">${l}</button>`).join("");
  $("#nbar").innerHTML = "Notification" in window && Notification.permission === "default" ? `<button data-act="notif">Benachrichtigungen aktivieren</button>` : "";
  const v = $("#view");
  if (document.activeElement && v.contains(document.activeElement) && ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return; // Eingabe nicht zerstören
  const sorted = [...wetten].sort((a, b) => b.datum.localeCompare(a.datum));
  if (tab === "wetten") {
    const o = sorted.filter(w => w.status === "offen"), c = sorted.filter(w => w.status !== "offen");
    v.innerHTML = `<p class="mute">Wette antippen für Chart und Tipp. Der Pot neuer Wetten wird verdoppelt. Serien-Bonus auf Gewinne: 2 richtige in Folge ×1,25, 3 ×1,5, ab 4 ×2.</p>` + (o.length ? o.map(betCard).join("") : `<p class="mute">Gerade keine offene Wette. Der Admin legt neue an.</p>`) + (c.length ? "<h2>Beendet</h2>" + c.map(betCard).join("") : "");
  } else if (tab === "updates") {
    const F = feed();
    v.innerHTML = F.length ? F.map(e => `<div class="card ${e.t > hl ? "new" : ""}"><span class="mute">${new Date(e.t).toLocaleString("de-DE", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"})}</span><br><b class="${e.cls || ""}">${esc(e.txt)}</b></div>`).join("") : `<p class="mute">Noch keine Neuigkeiten.</p>`;
  } else if (tab === "anw") {
    const L = Object.values(ST).sort((a, b) => b.all - a.all);
    const card = s => { const p = Math.round(s.da / s.all * 100); return `<div class="card"><div class="top"><b>${esc(s.n)}</b><span class="pts">${p} %</span></div><div class="bar"><i style="width:${p}%"></i></div><div class="mute">${s.da} von ${s.all} Wetten ${s.typ === "freund" ? "da" : "anwesend"}</div></div>`; };
    v.innerHTML = L.length ? [["lehrer", "Lehrer"], ["freund", "Schüler"]].map(([t, l]) => { const X = L.filter(s => s.typ === t); return X.length ? `<h2>${l}</h2>` + X.map(card).join("") : ""; }).join("") : `<p class="mute">Noch keine ausgewerteten Wetten.</p>`;
  } else if (tab === "shop") {
    const free = me.points - open(), own = me.owned || [], eq = me.equipped || {};
    v.innerHTML = `<p class="mute">Gib Punkte für Namens-Looks aus. Sie erscheinen in der Rangliste und bei den Tipps. Du hast ${free} freie Punkte. Schrift, Farbe und Animation lassen sich kombinieren.</p>` +
      Object.entries(CATS).map(([cat, label]) => `<h2>${label}</h2>` + SHOP.filter(i => i.cat === cat).map(i => {
        const has = own.includes(i.id), on = eq[cat] === i.id;
        const btn = has ? (on ? `<button data-act="equip" data-c="${cat}" data-i="">Ablegen</button>` : `<button class="pri" data-act="equip" data-c="${cat}" data-i="${i.id}">Anlegen</button>`)
          : `<button class="pri" data-act="buy" data-i="${i.id}" ${free < i.p ? "disabled" : ""}>${i.p} Punkte</button>`;
        return `<div class="card top"><div><div>${nm(me.name, {[cat]: i.id})}</div><div class="mute">${i.n}${on ? " · angelegt" : ""}</div></div>${btn}</div>`;
      }).join("")).join("");
  } else if (tab === "tickets") {
    v.innerHTML = ticketsHtml();
  } else if (tab === "rang") {
    v.innerHTML = `<p class="mute">Tippe auf einen Namen, um das Profil zu sehen.</p>` + [...users].sort((a, b) => b.points - a.points).map(lbRow).join("");
  } else {
    v.innerHTML = `<h2>Neue Wette</h2><div class="card"><div class="row">${betFields("w")}</div><div class="row" style="margin-top:8px"><input id="wd" type="date"><button class="pri" data-act="newbet">Anlegen</button></div></div>${serienHtml()}
      <h2>Offene Wetten auswerten</h2>` + (sorted.filter(w => w.status === "offen").map(w => `<div class="card"><b>${esc(w.frage)}</b>
        <div class="row" style="margin-top:8px">${settleBtns(w)}</div></div>`).join("") || `<p class="mute">Nichts offen.</p>`) +
      `<h2>Einladungscodes</h2><div class="card row"><input id="cn" placeholder="Code-Name (leer = zufällig)"><input id="cm" type="number" min="1" value="1" title="Wie oft nutzbar" aria-label="Wie oft nutzbar" style="max-width:90px"><button class="pri" data-act="newcode">Code erzeugen</button></div><div class="card">` +
      (codes.filter(c => rest(c) > 0).map(c => `<div class="rk"><code>${esc(c.id)}</code><span class="mute">${rest(c)} von ${c.max || 1} frei</span></div>`).join("") || `<span class="mute">Keine freien Codes.</span>`) + `</div>`;
  }
}

document.addEventListener("click", e => {
  if (e.target.id === "modal") return closeM();
  if (e.target.id === "news") return closeNews();
  if (e.target.id === "prof") return closeP();
  const b = e.target.closest("[data-act]"); if (!b) return; const a = b.dataset.act;
  if (a === "login") login(); else if (a === "register") register(); else if (a === "logout") signOut(auth);
  else if (a === "tab") { tab = b.dataset.t; if (tab === "updates") hl = seenAt; render(); }
  else if (a === "notif") Notification.requestPermission().then(render);
  else if (a === "open") { openBet = b.dataset.w; mSide = "ja"; mAmt = ""; render(); }
  else if (a === "close") closeM();
  else if (a === "side") { document.activeElement.blur(); mSide = b.dataset.s; renderModal(); }
  else if (a === "amt") { document.activeElement.blur(); const mx = me.points - open(); mAmt = String(b.dataset.v === "max" ? mx : Math.min(mx, (parseInt(mAmt, 10) || 0) + +b.dataset.v)); renderModal(); }
  else if (a === "bet2") bet(openBet, mSide, {value: mAmt}).then(() => { mAmt = ""; });
  else if (a === "buy") buy(b.dataset.i);
  else if (a === "equip") equip(b.dataset.c, b.dataset.i);
  else if (a === "settleU") settleU(b.dataset.w);
  else if (a === "tsend") sendTicket();
  else if (a === "tsave") saveTicket(b.dataset.i);
  else if (a === "tdel") { if (confirm("Ticket löschen?")) deleteDoc(doc(db, "tickets", b.dataset.i)); }
  else if (a === "newserie") newSerie();
  else if (a === "sertog") updateDoc(doc(db, "serien", b.dataset.i), {aktiv: serien.find(x => x.id === b.dataset.i).aktiv === false});
  else if (a === "serdel") { if (confirm("Serie löschen? Schon angelegte Wetten bleiben.")) deleteDoc(doc(db, "serien", b.dataset.i)); }
  else if (a === "news") closeNews();
  else if (a === "prof") { profU = b.dataset.u; renderProf(); }
  else if (a === "pclose") closeP();
  else if (a === "avdel") updateDoc(doc(db, "users", me.id), {avatar: ""});
  else if (a === "copyinv") { const t = "Komm auf die Wettseite: " + location.origin + location.pathname + " (bei der Registrierung als Code einfach meinen Namen eingeben: " + me.name + ")"; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Einladung kopiert"), () => prompt("Einladung kopieren:", t)); }
  else if (a === "bet") bet(b.dataset.w, b.dataset.s, document.querySelector(`[data-bet="${b.dataset.w}"]`));
  else if (a === "settle") settle(b.dataset.w, b.dataset.s);
  else if (a === "newbet") newBet(); else if (a === "newcode") newCode();
});
document.addEventListener("input", e => {
  if (e.target.id === "amt") { mAmt = e.target.value; const x = $("#est"); if (x) x.textContent = est(wetten.find(w => w.id === openBet)); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && profU) closeP(); else if (e.key === "Escape" && openBet) closeM();
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset && ["open", "prof"].includes(e.target.dataset.act)) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "titelsel") updateDoc(doc(db, "users", me.id), {titel: e.target.value}).catch(() => alert("Titel konnte nicht gespeichert werden."));
  if (e.target.id === "avfile") setAvatar(e.target.files[0]);
});
</script>
</body>
