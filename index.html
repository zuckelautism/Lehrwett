<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Website nicht verfügbar</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 24px;
      display: grid; place-items: center;
      background: #f1f3f6; color: #202938;
    }
    main {
      width: min(100%, 560px); padding: 36px 28px;
      text-align: center; background: #fff; border: 1px solid #dce1e8;
      border-radius: 16px; box-shadow: 0 12px 36px rgba(20, 33, 61, .08);
    }
    .icon { font-size: 2.5rem; margin-bottom: 12px; }
    h1 { margin: 0 0 14px; font-size: clamp(1.6rem, 5vw, 2.1rem); }
    p { margin: 10px 0; line-height: 1.6; color: #536071; }
    @media (prefers-color-scheme: dark) {
      body { background: #10151f; color: #edf1f7; }
      main { background: #1a2130; border-color: #303b50; box-shadow: none; }
      p { color: #b3bdcc; }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">⚠️</div>
    <h1>Website nicht verfügbar</h1>
    <p>Diese Website funktioniert derzeit leider nicht.</p>
    <p>Bei Fragen oder Problemen wende dich bitte direkt an den Ersteller dieser Website.</p>
  </main>
</body>
</html>
